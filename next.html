<!--
  next.html: the game's address from Phase 1 until W7. Since the switch-over (SPEC Q-126, F-14) the game is the site's
  root (index.html), and this page sends old links there, keeping ?seed=, ?date= and the rest of the address.
  GitHub Pages caches each file for 10 minutes, so for a while after the deploy a browser may still hold the old root,
  which sent everyone here: going back to './' would bounce between the two. So after two hops in a tab this page goes
  to index.html by name, an address the old root was almost never cached under, and the game (app/start.js) clears the
  count when it starts. With no session storage it goes there at once.
-->
<script>
  (function () {
    var rest = location.search + location.hash, n = 0;
    try { n = +sessionStorage.getItem('gridwatch:hop') || 0; sessionStorage.setItem('gridwatch:hop', String(n + 1)); } catch (e) { n = 2; }
    location.replace((n < 2 ? './' : 'index.html') + rest);
  })();
</script>
