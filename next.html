<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIDWATCH</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="desk/desk.css">
<!--
  next.html: the Phase 1a greybox game (SPEC Phase 1 "next.html plays a full day at a flat 120x
  with the desk, the Live Stack, the watch and the map"; desk/README.md §8). The Phase 0.2 bench
  moved to bench.html. Static: no build, no requests to other origins. Serve the repo root and
  open next.html. Query: ?seed=N (default: today, YYYYMMDD) &perf (the F-11 overlay).
  Layout (SPEC §4.2, K-17): a 32-px header (40 px from 1600 px wide), the map on top, the desk
  at the bottom: max(300 px, half the viewport below the header). app/boot.js mounts the map,
  the desk and the Live Stack, and draws the overlays below.
-->
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --panel2: #1b222c; --line: #2a323d; --text: #c9d1d9; --dim: #8b949e;
    --faint: #6e7781; --bright: #f0f6fc; --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
    --violet: #a371f7; --orange: #f0883e;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
    --hdr: 32px;
  }
  @media (min-width: 1600px) { :root { --hdr: 40px; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* K-17: header, map (the rest), desk = max(300 px, 50% of the viewport below the header). */
  body { display: grid; grid-template-rows: var(--hdr) minmax(0, 1fr) max(300px, calc((100vh - var(--hdr)) / 2));
    height: 100vh; min-width: 1280px; min-height: 600px; overflow: hidden; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 8px; cursor: pointer; white-space: nowrap; min-height: 24px; min-width: 24px; }
  button:hover:not(:disabled) { border-color: var(--dim); color: var(--bright); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.on { background: #1f6feb33; border-color: var(--blue); color: var(--bright); }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  header { display: flex; align-items: center; gap: 10px; padding: 0 8px; border-bottom: 1px solid var(--line);
    background: var(--panel); height: var(--hdr); overflow: hidden; }
  .brand { font-weight: 700; letter-spacing: 0.1em; color: var(--bright); }
  #clock { font: 700 16px var(--mono); color: var(--bright); min-width: 86px; }
  #rate-badge { font: 700 12px var(--mono); padding: 2px 8px; border-radius: 4px; background: #1f6feb22; border: 1px solid var(--blue);
    color: var(--bright); min-width: 170px; text-align: center; }
  #rate-badge.WATCH, #rate-badge.RESPOND-CARD { background: #d2992233; border-color: var(--amber); }
  #rate-badge.RESPOND, #rate-badge.FOCUS { background: #a371f722; border-color: var(--violet); }
  #rate-badge.FAST { background: #3fb95022; border-color: var(--green); }
  #rate-badge.PAUSE, #rate-badge.HIDDEN, #rate-badge.OVER { background: #6e768133; border-color: var(--faint); }
  .chip { font: 11px var(--mono); color: var(--dim); padding: 2px 8px; border: 1px solid var(--line); border-radius: 10px; }
  .chip b { color: var(--bright); font-weight: 700; }
  .grow { flex: 1; }

  #map { position: relative; min-height: 0; overflow: hidden; background: #0a0e14; }
  #desk { position: relative; min-height: 0; overflow: hidden; border-top: 1px solid var(--line); background: var(--panel); }
  #stack-overlay { position: fixed; z-index: 8; left: 16px; right: 16px; top: calc(var(--hdr) + 8px); height: 420px;
    background: var(--panel); border: 1px solid var(--dim); border-radius: 6px; box-shadow: 0 10px 30px #000c; }

  /* K-15: the watch. The vignette never takes clicks (ACK, SILENCE, pause and skip still work). */
  body.watch #map::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 50px #000e; }
  #watch-vignette { position: fixed; z-index: 9; left: 50%; top: calc(var(--hdr) + 10px); transform: translateX(-50%);
    pointer-events: none; text-align: center; }
  #stopwatch { font: 700 26px var(--mono); color: var(--amber); text-shadow: 0 2px 8px #000; }
  #beat-caption { font: 600 14px system-ui, sans-serif; color: var(--bright); text-shadow: 0 2px 8px #000; margin-top: 2px; }
  #beat-steps { font: 11px var(--mono); color: var(--faint); margin-top: 3px; }
  #beat-steps b { color: var(--amber); }

  .card { position: fixed; z-index: 12; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--dim); border-radius: 8px; padding: 12px 16px; box-shadow: 0 12px 40px #000c; }
  .card h2 { margin: 0 0 6px; color: var(--bright); font-size: 15px; }
  .card p { margin: 4px 0; }
  #respond-card { top: calc(var(--hdr) + 60px); width: 620px; border-color: var(--amber); }
  #respond-card p { font: 13px/1.4 var(--mono); color: var(--bright); }
  #respond-card p.hint { color: var(--amber); }
  #briefing-card { top: calc(var(--hdr) + 40px); width: 520px; }
  #briefing-card .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #briefing-card .take { font-weight: 700; padding: 6px 16px; border-color: var(--blue); }
  #end-card { top: calc(var(--hdr) + 40px); width: 520px; }
  #end-card .score { font: 13px var(--mono); }
  #toast { position: fixed; z-index: 14; left: 50%; bottom: 16px; transform: translateX(-50%); background: #da363333;
    border: 1px solid var(--red); color: var(--bright); border-radius: 6px; padding: 4px 12px; font-size: 12px; }
  #drawer { position: fixed; z-index: 15; top: 0; right: 0; bottom: 0; width: 470px; overflow-y: auto; background: var(--panel);
    border-left: 1px solid var(--dim); padding: 10px 12px; box-shadow: -8px 0 24px #000a; }
  #drawer h2 { margin: 0 0 6px; font-size: 14px; color: var(--bright); }
  #drawer article { border-top: 1px solid var(--line); padding: 6px 0; }
  #drawer article h4 { margin: 0 0 3px; color: var(--bright); font-size: 12px; }
  #drawer article p { margin: 2px 0; } #drawer article p b { color: var(--dim); }
  #popover { position: fixed; z-index: 20; max-width: 420px; background: var(--panel2); border: 1px solid var(--dim); border-radius: 6px;
    padding: 8px 10px; box-shadow: 0 8px 24px #000a; }
  #popover h4 { margin: 0 0 4px; color: var(--bright); font-size: 12px; }
  #popover p { margin: 3px 0; } #popover p b { color: var(--dim); }
  #q-layer { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  #q-layer .q { position: absolute; pointer-events: auto; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    font: 700 11px/22px system-ui, sans-serif; color: var(--dim); background: #151b23cc; border: 1px solid var(--line); }
  header .q.inline { width: 24px; height: 24px; padding: 0; margin-left: -6px; border-radius: 50%;
    font: 700 11px/22px system-ui, sans-serif; color: var(--dim); background: transparent; border: 1px solid var(--line); flex: none; }
  #perf { position: fixed; z-index: 30; right: 8px; bottom: 8px; margin: 0; padding: 6px 8px; font: 11px var(--mono);
    background: #000c; color: var(--green); border: 1px solid var(--line); border-radius: 4px; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
  noscript { padding: 20px; }
</style>
<body>
<header id="hdr">
  <div class="brand">GRIDWATCH</div>
  <div id="clock" title="Grid clock (the day runs 04:00 to 04:00)"><span id="clock-text">04:00</span></div>
  <div id="rate-badge" role="status" title="Mode and playback rate: grid seconds per real second (F-5)"><span id="rate-text">PAUSE 0×</span></div>
  <div id="chip-lights" class="chip" title="LIGHTS ON: share of the energy the city asked for that it got">LIGHTS ON <b id="chip-lights-v">100%</b></div>
  <div id="chip-cost" class="chip" title="CUSTOMER COST so far">COST <b id="chip-cost-v">-</b> c/kWh</div>
  <div id="chip-co2" class="chip" title="CO₂ per MWh generated in the region so far">CO₂ <b id="chip-co2-v">-</b> t/MWh</div>
  <span class="grow"></span>
  <button id="btn-pause" title="Space">PAUSE</button>
  <button id="btn-mute" title="Sound on or off (Shift+M)">SOUND ON</button>
  <button id="btn-help" title="Every abstraction GRIDWATCH makes, and why (?)">?</button>
</header>
<div id="map" aria-label="The city and its power stations"></div>
<div id="desk" aria-label="The control desk"></div>
<noscript>GRIDWATCH needs JavaScript (ES modules).</noscript>

<div id="stack-overlay" hidden></div>
<div id="watch-vignette" hidden aria-live="polite"><div id="stopwatch">T+0.00 s ×0.15</div><div id="beat-caption"></div><div id="beat-steps"></div></div>
<div id="respond-card" class="card" role="dialog" aria-label="What happened" hidden></div>
<div id="briefing-card" class="card" role="dialog" aria-label="Briefing" hidden>
  <h2>Tonight's desk</h2>
  <p id="briefing-text">Line up enough power before the city needs it; the machines handle the seconds.</p>
  <p id="briefing-watch" class="dim"></p>
  <div class="row" id="briefing-mode" role="radiogroup" aria-label="Regulation">
    <button id="btn-agc" class="on" role="radio" aria-checked="true" title="AGC trims every unit inside its band (the default)">AGC</button>
    <button id="btn-hand" role="radio" aria-checked="false" title="Fly by hand: no automatic trim all day (harder)">HAND</button>
    <span class="grow"></span>
    <button id="btn-take" class="take" title="Enter">TAKE THE DESK</button>
  </div>
</div>
<div id="end-card" class="card" role="dialog" aria-label="Day over" hidden></div>
<div id="drawer" role="dialog" aria-label="Abstractions" hidden></div>
<div id="popover" role="dialog" hidden></div>
<div id="toast" role="alert" hidden></div>
<div id="q-layer"></div>
<div id="aria-live" class="sr" aria-live="polite"></div>
<pre id="perf" hidden></pre>
<script type="module" src="app/boot.js"></script>
</body>
