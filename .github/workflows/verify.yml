# W7 (Q15): the verify run on pushes that can move par's day. It replays par on every listed daily (and the scripted players on
# a sample, and the selftest's cases) and compares them with what content/dailies.js, content/ladder.js, content/anniversaries.js
# and content/selftest.js store (tools/verify.mjs --check: it never writes). Under an unchanged stamp it catches a change to the
# sim that should have bumped SIM_VERSION, on every daily; after a bump it says whether `npm run verify` can restamp or the lists
# must be made again. A workflow of its own, with a paths filter, so the test job (test.yml) is not slowed; it only reports, as
# the tests do (GitHub Pages deploys from main regardless, F-10).
name: verify the dailies
on:
  push:
    paths:
      - 'sim/**'
      - 'content/scenarios.js'
      - 'content/anniversaries.js'
      - 'content/dailies.js'
      - 'content/ladder.js'
      - 'content/selftest.js'
      - 'app/system.js'
      - 'app/score.js'
      - 'tools/verify.mjs'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'sim/**'
      - 'content/scenarios.js'
      - 'content/anniversaries.js'
      - 'content/dailies.js'
      - 'content/ladder.js'
      - 'content/selftest.js'
      - 'app/system.js'
      - 'app/score.js'
      - 'tools/verify.mjs'
      - '.github/workflows/verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # (446 par days and a sample of the players on the runner's 4 CPUs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify.mjs --check -j 4
