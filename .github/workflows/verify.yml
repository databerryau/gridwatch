# W7 (Q15): the verify run. It replays par on every listed daily (and the scripted players on a sample, and the selftest's
# cases) and compares them with what content/dailies.js, content/ladder.js, content/anniversaries.js and content/selftest.js
# store (tools/verify.mjs --check: it never writes). Under an unchanged stamp it catches a change that should have bumped
# SIM_VERSION where it moves what it plays: par's day on every daily, the scripted players and the page's no-input day on a
# sample, and the selftest's cases (par, no input, scripted logs). It plays no HAND day and none of a player's own presses, so a
# change only those read passes it (tests/hand-guard.test.js holds one HAND day with a START in the suite). After a bump it
# fails until `npm run verify` has restamped the lists, or says the lists must be made again.
# A required check (SPEC Q-135): main is protected, so a pull request merges only when this and test.yml's job have passed.
# It runs on every push and pull request, with no paths filter: a required check that never runs would block the merge, and
# what verify depends on reaches well beyond sim/ (app/game.js's no-input day, content/seasons.js, the generators).
name: verify the dailies
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # (446 par days and a sample of the players on the runner's 4 CPUs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/verify.mjs --check -j 4
